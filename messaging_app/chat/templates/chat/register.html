{% extends 'chat/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Register</h2>
    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_username" class="text-white">Username:</label>
            {{ form.username }}
        </div>

        <div class="form-group position-relative">
            <label for="id_password1" class="text-white">Password:</label>
            <input type="password" name="password1" id="id_password1" class="form-control" required>
            <span class="toggle-password" onclick="togglePasswordVisibility(this, 'id_password1')" style="cursor: pointer; position: absolute; right: 10px; top: 35px">👁</span>
        </div>

        <div class="form-group position-relative">
            <label for="id_password2" class="text-white">Confirm Password:</label>
            <input type="password" name="password2" id="id_password2" class="form-control" required>
            <span class="toggle-password" onclick="togglePasswordVisibility(this, 'id_password2')" style="cursor: pointer; position: absolute; right: 10px; top: 35px">👁</span>
        </div>

        <button type="submit" class="btn btn-primary">Register</button>
    </form>
</div>

<script>
    function togglePasswordVisibility(icon, fieldId){
        const field = document.getElementById(fieldId);
        if (field.type === "password"){
            field.type = "text";
            icon.textContent = "🙈";
        } else {
            field.type = "password";
            icon.textContent = "👁";
        }
    }
</script>
{% endblock %}
