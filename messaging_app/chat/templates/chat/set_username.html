{% extends 'chat/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 style="color: #ffffff;">Create Your Username</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group mt-3">
            <label for="{{ form.username.id_for_label }}" style="color: white;">
                {{ form.username.label }}
            </label>
            {{ form.username }}
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock %}
