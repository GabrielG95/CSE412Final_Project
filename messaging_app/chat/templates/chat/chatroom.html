<!DOCTYPE html>
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Chatroom</title>
    <link rel="stylesheet" href="{% static 'chat/main.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #800080;">
    <div class="container mt-4">
        <h2 style="text-align: center;">Chatroom</h2>
        
        <div class="mb-4">
            <form method="post" class="d-flex align-items-center gap-2">
                {% csrf_token %}
                {{ form.content }}
                <button type="submit" style="height: 40px;" class="btn btn-primary">Send</button>
            </form>
        </div>

        <div class="chat-containers">
            {% for message in content %}
                <div class="message mb-2">
                    <strong>{{ message.user.username }}</strong>: {{ message.content }} <br>
                    <small>{{ message.date_posted}}</small>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
