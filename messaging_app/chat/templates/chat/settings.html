{% extends 'chat/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Settings</h2>

    <form id="colorForm" method="post">
        {% csrf_token %}
        <label for="color">Select Username Color:</label>
        <select class="form-control" id="color" name="color">
            <option value="#000000">Black</option>
            <option value="#ff0000">Red</option>
            <option value="#008000">Green</option>
            <option value="#0000ff">Blue</option>
            <option value="#ff69b4">Pink</option>
            <option value="#800080">Purple</option>
        </select>
        <button type="button" class="btn btn-warning mt-3" data-toggle="modal" data-target="#confirmModal">
            Change Color
        </button>
    </form>
</div>

<!-- Confirmation Modal -->
 <div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Color Change</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                Are you sure you want to update your username color ?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="document.getElementById('colorForm').submit();">Confirm</button>
            </div>
        </div>
    </div>
 </div>
 {% endblock %}
