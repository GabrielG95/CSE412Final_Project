{% extends 'chat/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 style="color: #ffffff;">Chat with AI Assistant</h2>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <textarea class="form-control" name="user_input" rows="3" placeholder="Question..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary mt-2">Send</button>
    </form>

    {% if response %}
        <div class="mt-4 p-3" style="background-color: #f8f9fa; border-radius: 10px;">
            <h5><strong>Your Question:</strong></h5>
            <p>{{ user_input }}</p>

            <h5><strong>AI Response:</strong></h5>
            <p>{{ response }}</p>
        </div>
    {% endif %}
</div>
{% endblock %}
